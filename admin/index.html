<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Delivery — Acceso</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand"><span class="leaf">🌿</span><h1>Panel Delivery</h1></div>
    <p class="sub">Ingresa con tu cuenta de administrador para gestionar locales, menús, pedidos y drivers.</p>

    <form id="form-login">
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username" placeholder="admin@tuempresa.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      <p class="login-error" id="login-error"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
  // Si ya hay una sesión activa, salta directo al dashboard
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "dashboard.html";
  });

  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errEl = document.getElementById("login-error");
    errEl.textContent = "";

    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Ingresando...";

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = "Correo o contraseña incorrectos.";
      console.error("Error de login:", error);
      btn.disabled = false; btn.textContent = "Ingresar";
      return;
    }
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
