<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoMoto · Panel de administrador</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/logo-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<section id="login-screen" class="login-screen">
  <form id="login-form" class="login-card">
    <img src="../assets/logo-light.png" alt="MotoMoto" class="login-logo">
    <h1>Panel de administrador</h1>
    <p class="login-sub">Ingresa con tu cuenta para gestionar restaurantes, platos, promociones y pedidos.</p>

    <label class="field">
      <span>Correo electrónico</span>
      <input type="email" id="login-email" autocomplete="username" required>
    </label>
    <label class="field">
      <span>Contraseña</span>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </label>

    <p id="login-error" class="form-error" hidden></p>

    <button type="submit" class="btn btn-primary btn-block" id="login-submit">Iniciar sesión</button>
  </form>
</section>

<!-- ===================== APP SHELL ===================== -->
<div id="app-shell" class="app-shell" hidden>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/logo-light.png" alt="MotoMoto">
      <span>Admin</span>
    </div>
    <nav class="sidebar-nav">
      <button type="button" class="nav-btn" data-section="orders">
        <span class="nav-icon">🧾</span> Pedidos
      </button>
      <button type="button" class="nav-btn" data-section="restaurants">
        <span class="nav-icon">🏬</span> Restaurantes
      </button>
      <button type="button" class="nav-btn" data-section="dishes">
        <span class="nav-icon">🍔</span> Platos
      </button>
      <button type="button" class="nav-btn" data-section="promos">
        <span class="nav-icon">📣</span> Promociones
      </button>
    </nav>
    <div class="sidebar-footer">
      <span id="admin-email" class="admin-email"></span>
      <button type="button" id="logout-btn" class="btn btn-ghost btn-block">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <button type="button" id="mobile-nav-toggle" class="mobile-nav-toggle" aria-label="Abrir menú">☰</button>
      <h2 id="section-title">Pedidos</h2>
    </header>

    <div id="toast" class="toast" hidden></div>

    <div id="view-root" class="view-root">
      <!-- cada sección inyecta su contenido acá -->
    </div>
  </main>
</div>

<!-- ===================== MODAL GENÉRICO ===================== -->
<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal" id="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modal-title">Título</h3>
      <button type="button" id="modal-close" class="modal-close" aria-label="Cerrar">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/restaurants.js"></script>
<script src="js/dishes.js"></script>
<script src="js/promos.js"></script>
<script src="js/orders.js"></script>
<script src="js/app.js"></script>
</body>
</html>
