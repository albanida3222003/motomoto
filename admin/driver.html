<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Driver</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .driver-shell { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .driver-top { display:flex; align-items:center; justify-content:space-between; padding: 18px 4px; }
  .driver-top .brand { display:flex; align-items:center; gap:8px; }
  .driver-order-card { background: var(--card); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .driver-order-card h4 { font-size: 15px; }
  .step-btn { width:100%; margin-top:8px; }
</style>
</head>
<body>

<!-- LOGIN DRIVER -->
<div class="login-wrap" id="driver-login-wrap">
  <div class="login-card">
    <div class="brand"><span class="leaf">🛵</span><h1>Acceso Driver</h1></div>
    <p class="sub">Ingresa tu teléfono registrado y tu PIN para ver tus pedidos disponibles.</p>
    <form id="form-driver-login">
      <div class="field"><label>Teléfono</label><input type="tel" id="dl-telefono" required></div>
      <div class="field"><label>PIN (4 dígitos)</label><input type="text" id="dl-pin" maxlength="4" required></div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      <p class="login-error" id="dl-error"></p>
    </form>
  </div>
</div>

<!-- APP DRIVER -->
<div class="driver-shell" id="driver-app" style="display:none;">
  <div class="driver-top">
    <div class="brand"><span class="leaf">🛵</span><strong id="dv-nombre">Driver</strong></div>
    <button class="btn btn-outline btn-sm" id="btn-driver-logout">Salir</button>
  </div>

  <div class="section-title">Mi pedido actual</div>
  <div id="mi-pedido"><p class="helptext">No tienes un pedido en curso.</p></div>

  <div class="section-title">Pedidos disponibles para tomar</div>
  <div id="pedidos-disponibles"><p class="helptext">Cargando...</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script src="js/utils.js"></script>
<script src="js/driver-app.js"></script>
</body>
</html>
